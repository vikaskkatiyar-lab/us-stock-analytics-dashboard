name: Daily Stock Dashboard Refresh

on:
  schedule:
    - cron: "0 10 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor and prediction tracking
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python src/run_daily_prediction_cycle.py

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh stock dashboard data"
            git push
          fi

      - name: Upload dashboard data artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-dashboard-data
          path: |
            data/
            reports/
